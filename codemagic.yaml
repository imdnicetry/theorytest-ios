workflows:
  ios-release:
    name: App Store release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic API key
    environment:
      xcode: latest
    scripts:
      - name: Unpack project
        script: |
          if [ -f project.zip ]; then unzip -oq project.zip; fi
          ls
      - name: Set up keychain
        script: keychain initialize
      - name: Delete old certificates
        script: |
          app-store-connect certificates list --type IOS_DISTRIBUTION --json \
            | grep -o '"id": "[^"]*"' \
            | grep -o '"[^"]*"$' \
            | tr -d '"' \
            | xargs -r -n1 app-store-connect certificates delete || true
      - name: Create distribution certificate
        script: |
          openssl genrsa -out /tmp/dist_key.pem 2048
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key "$(cat /tmp/dist_key.pem)" \
            --save
      - name: Fetch provisioning profiles
        script: |
          app-store-connect fetch-signing-files ie.driverzoneireland.theorytest --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project TheoryTestIRL.xcodeproj --scheme TheoryTestIRL --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER MARKETING_VERSION=1.0.3"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
