workflows:
  ios-release:
    name: App Store release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic3
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ie.driverzoneireland.theorytest
    scripts:
      - name: Unpack project
        script: |
          if [ -f project.zip ]; then unzip -oq project.zip; fi
          ls
      - name: Set export options
        script: |
          cat > /Users/builder/export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>D6ZCK5BMR5</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>ie.driverzoneireland.theorytest</key>
                  <string>TheoryTestIRL AppStore</string>
              </dict>
          </dict>
          </plist>
          EOF
      - name: Build IPA
        script: xcode-project build-ipa --project TheoryTestIRL.xcodeproj --scheme TheoryTestIRL --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER MARKETING_VERSION=1.0.3"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
