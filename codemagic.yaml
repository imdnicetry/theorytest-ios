workflows:
  ios-release:
    name: App Store release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ie.driverzoneireland.theorytest
    scripts:
      - name: Unpack project
        script: |
          if [ -f project.zip ]; then unzip -oq project.zip; fi
          ls
      - name: Build IPA
        script: xcode-project build-ipa --project TheoryTestIRL.xcodeproj --scheme TheoryTestIRL --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER MARKETING_VERSION=1.0.3"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
